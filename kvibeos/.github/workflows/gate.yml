# KVibeOS CI (PROTECTED). Re-checks the last completed milestone from scratch on every push,
# independently of the build agent's machine, with KVM so performance budgets get real numbers.
# GitHub only reads .github/ at a repository root: this takes effect once kvibeos/ is its own repo.
name: gate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso mtools dosfstools gdisk

      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          cargo --version

      - name: Cache cargo tools and registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-mutants
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Gate tools
        run: |
          command -v cargo-mutants  || cargo install --locked cargo-mutants
          command -v cargo-llvm-cov || cargo install --locked cargo-llvm-cov

      - name: Doctor
        run: make doctor

      - name: Verify last completed milestone (full gate, no bump)
        run: make verify

      - name: Upload ISO, logs, screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvibeos-${{ github.sha }}
          path: |
            build/kvibeos.iso
            build/logs/
          if-no-files-found: warn
