# Release ISO boot menu. The fast test loop uses boot/limine-test.conf (timeout 0, single entry).
# The installed config (M14) adds a Windows chainload entry and a "previous version" entry.
timeout: 2

/KVibeOS
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/kernel.sym

/KVibeOS (safe mode)
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/kernel.sym
    cmdline: kvibe.safe

/KVibeOS (verbose boot log)
    protocol: limine
    path: boot():/boot/kernel
    module_path: boot():/boot/kernel.sym
    cmdline: kvibe.verbose
